name: coffeeshop
services:
  composer:
    image: composer:2
    profiles: [tools]
    user: "${LOCAL_UID:-501}:${LOCAL_GID:-20}"
    working_dir: /app
    environment:
      COMPOSER_HOME: /tmp/composer
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    volumes:
      - .:/app
  app:
    build: .
    user: "${LOCAL_UID:-501}:${LOCAL_GID:-20}"
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-coffee}
      MYSQL_USER: ${DB_USERNAME:-coffee}
      MYSQL_PASSWORD: ${DB_PASSWORD:-coffee_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:
